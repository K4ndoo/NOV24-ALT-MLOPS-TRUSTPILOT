name: Weekly Training Pipeline

on:
  schedule:
    - cron: '37 2 * * 0' # Tous les dimanches vers 2h37 du matin
  workflow_dispatch: # Pour le lancer manuellement

jobs:
  training:
    runs-on: ubuntu-latest
    
    # On définit les variables d'environnement depuis les secrets GitHub
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les dépendances + kaggle
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright beautifulsoup4 dvc dvc-s3 kaggle
          
      - name: Installer Playwright (Navigateur)
        run: playwright install chromium
        
      - name: Configurer DVC
        run: |
          # DVC a besoin des identifiants pour télécharger/envoyer les données
          dvc remote modify origin --local user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          
      - name: DVC Pull (Récupérer les anciennes données)
        run: dvc pull
        
      - name: Scraper de nouvelles données (VeePee / ShowRoom)
        run: python -u src/data_collection/scraper.py --preset training
        
      - name: Sauvegarder les nouvelles données d'entraînement
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          dvc add data/labelled_dataset/dataset_avis.csv
          dvc push
          git add data/labelled_dataset/dataset_avis.csv.dvc .gitignore
          git commit -m "Auto-update: Nouvelles données d'entraînement" || echo "Rien à commiter"
          git push
          
      - name: Publier les secrets dans un dataset Kaggle privé
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p kaggle_secrets_ds
          cat <<EOF > kaggle_secrets_ds/secrets.json
          {
            "MLFLOW_TRACKING_URI": "${{ secrets.MLFLOW_TRACKING_URI }}",
            "MLFLOW_TRACKING_USERNAME": "${{ secrets.MLFLOW_TRACKING_USERNAME }}",
            "MLFLOW_TRACKING_PASSWORD": "${{ secrets.MLFLOW_TRACKING_PASSWORD }}",
            "GITHUB_USERNAME": "${{ secrets.USERNAME_GIT }}",
            "GITHUB_TOKEN": "${{ secrets.TOKEN_GIT }}"
          }
          EOF

          DATASET_ID="$KAGGLE_USERNAME/trustpilot-ci-secrets"
          jq -n --arg id "$DATASET_ID" \
            '{title: "Trustpilot CI Secrets", id: $id, licenses: [{name: "CC0-1.0"}]}' \
            > kaggle_secrets_ds/dataset-metadata.json

          # on inspecte sa sortie kaggle
          if kaggle datasets status "$DATASET_ID" >/dev/null 2>&1; then
            SORTIE=$(kaggle datasets version -p kaggle_secrets_ds -m "Secrets CI" 2>&1 || true)
          else
            SORTIE=$(kaggle datasets create -p kaggle_secrets_ds 2>&1 || true)
          fi
          echo "$SORTIE"
          if echo "$SORTIE" | grep -qi "error"; then
            echo "::error::Publication du dataset de secrets échouée"
            exit 1
          fi
          
          for _ in $(seq 1 30); do
            STATUT=$(kaggle datasets status "$DATASET_ID" 2>&1 || echo indisponible)
            echo "Statut du dataset : $STATUT"
            case "$STATUT" in *ready*) break ;; esac
            sleep 10
          done
          case "$STATUT" in
            *ready*) ;;
            *) echo "::error::Dataset de secrets non prêt (statut : $STATUT)"; exit 1 ;;
          esac

      - name: Lancer l'entraînement sur les GPU Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          # Ajout de '.enable_internet = true' dans la commande jq
          jq --arg id "$KAGGLE_USERNAME/trustpilot-camembert-training" \
             --arg ds "$KAGGLE_USERNAME/trustpilot-ci-secrets" \
             '.id = $id | .dataset_sources = [$ds] | .enable_internet = true' \
             kaggle/kernel-metadata.json > /tmp/kernel-metadata.json
             
          mv /tmp/kernel-metadata.json kaggle/kernel-metadata.json
          
          SORTIE=$(kaggle kernels push -p kaggle/ 2>&1 || true)
          echo "$SORTIE"
          if echo "$SORTIE" | grep -qi "error"; then
            echo "::error::Push du kernel Kaggle échoué"
            exit 1
          fi

      - name: on attend la fin de l'entraînement et récupérer le log
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          KERNEL_ID="$KAGGLE_USERNAME/trustpilot-camembert-training"
          
          # On attend 45min : au-delà, on considère l'entraînement en échec
          for _ in $(seq 1 45); do
            # On récupère la sortie brute de la commande sans chercher à la découper avec sed
            RAW_STATUS=$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)
            echo "Statut du kernel : $RAW_STATUS"

            case "$RAW_STATUS" in 
              *"COMPLETE"* | *"complete"*) 
                STATUT="complete"
                break 
                ;; 
              *"ERROR"* | *"error"*) 
                STATUT="error"
                break 
                ;; 
              *"CANCEL"* | *"cancel"*) 
                STATUT="cancelled"
                break 
                ;; 
            esac
            sleep 60
          done
          
          kaggle kernels output "$KERNEL_ID" -p kernel_log || true
          cat kernel_log/trustpilot-camembert-training.log || echo "Log du kernel indisponible"
          
          if [ "${STATUT:-inconnu}" != "complete" ]; then
            echo "::error::Entraînement Kaggle terminé en statut '$STATUT'"
            exit 1
          fi

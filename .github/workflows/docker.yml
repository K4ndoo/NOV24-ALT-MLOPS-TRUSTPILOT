name: Docker Build and Publish

on:
  push:
    branches:
      - feature-phase4-kinjal
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nov24-alt-mlops-trustpilot-api:latest

      - name: Build and push Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.airflow
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nov24-alt-mlops-trustpilot-airflow:latest

services:

============================================================
FastAPI
============================================================

api: build: context: . dockerfile: Dockerfile.api

containername: trustpilotapi

ports: - "8000:8000"

volumes: - ./src:/app/src - ./.env:/app/.env - ./models:/app/models - ./.dvc:/app/.dvc - ./.git:/app/.git

environment: MLFLOWTRACKINGURI: ${MLFLOWTRACKINGURI} MLFLOWTRACKINGUSERNAME: ${MLFLOWTRACKINGUSERNAME} MLFLOWTRACKINGPASSWORD: ${MLFLOWTRACKINGPASSWORD}

restart: unless-stopped

============================================================
Airflow Init
============================================================

airflow-init: build: context: . dockerfile: Dockerfile.airflow

containername: trustpilotairflow_init

volumes: - airflow_data:/opt/airflow - ./src:/opt/airflow/src - ./dags:/opt/airflow/dags - ./data:/opt/airflow/data - ./.env:/opt/airflow/.env - ./models:/opt/airflow/models - ./.dvc:/opt/airflow/.dvc - ./.git:/opt/airflow/.git

environment: AIRFLOWCOREEXECUTOR: SequentialExecutor AIRFLOWCORELOAD_EXAMPLES: "False"

MLFLOWTRACKINGURI: ${MLFLOWTRACKINGURI} MLFLOWTRACKINGUSERNAME: ${MLFLOWTRACKINGUSERNAME} MLFLOWTRACKINGPASSWORD: ${MLFLOWTRACKINGPASSWORD}

command: > bash -c " airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com "

============================================================
Airflow Webserver
============================================================

airflow-webserver: build: context: . dockerfile: Dockerfile.airflow

containername: trustpilotairflow_webserver

ports: - "8080:8080"

volumes: - airflow_data:/opt/airflow - ./src:/opt/airflow/src - ./dags:/opt/airflow/dags - ./data:/opt/airflow/data - ./.env:/opt/airflow/.env - ./models:/opt/airflow/models - ./.dvc:/opt/airflow/.dvc - ./.git:/opt/airflow/.git

environment: AIRFLOWCOREEXECUTOR: SequentialExecutor AIRFLOWCORELOAD_EXAMPLES: "False"

MLFLOWTRACKINGURI: ${MLFLOWTRACKINGURI} MLFLOWTRACKINGUSERNAME: ${MLFLOWTRACKINGUSERNAME} MLFLOWTRACKINGPASSWORD: ${MLFLOWTRACKINGPASSWORD}

command: airflow webserver

dependson: airflow-init: condition: servicecompleted_successfully

restart: unless-stopped

============================================================
Airflow Scheduler
============================================================

airflow-scheduler: build: context: . dockerfile: Dockerfile.airflow

containername: trustpilotairflow_scheduler

volumes: - airflow_data:/opt/airflow - ./src:/opt/airflow/src - ./dags:/opt/airflow/dags - ./data:/opt/airflow/data - ./.env:/opt/airflow/.env - ./models:/opt/airflow/models - ./.dvc:/opt/airflow/.dvc - ./.git:/opt/airflow/.git

environment: AIRFLOWCOREEXECUTOR: SequentialExecutor AIRFLOWCORELOAD_EXAMPLES: "False"

MLFLOWTRACKINGURI: ${MLFLOWTRACKINGURI} MLFLOWTRACKINGUSERNAME: ${MLFLOWTRACKINGUSERNAME} MLFLOWTRACKINGPASSWORD: ${MLFLOWTRACKINGPASSWORD}

command: airflow scheduler

dependson: airflow-init: condition: servicecompleted_successfully

restart: unless-stopped

============================================================
Prometheus
============================================================

prometheus: image: prom/prometheus:latest

containername: trustpilotprometheus

ports: - "9090:9090"

volumes: - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro - prometheus_data:/prometheus

restart: unless-stopped

============================================================
Grafana
============================================================

grafana: image: grafana/grafana:latest

containername: trustpilotgrafana

ports: - "3000:3000"

volumes: - grafana_data:/var/lib/grafana

environment: GFSECURITYADMINUSER: admin GFSECURITYADMINPASSWORD: admin GFUSERSALLOWSIGNUP: "false"

depends_on: - prometheus

restart: unless-stopped

============================================================
Persistent volumes
============================================================

volumes: airflowdata: prometheusdata: grafana_data:
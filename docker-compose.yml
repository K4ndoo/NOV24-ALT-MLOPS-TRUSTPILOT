version: '3.8'

services:
  # FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trustpilot_api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
      - ./models:/app/models
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}

  # Airflow
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: trustpilot_airflow
    ports:
      - "8080:8080"
    volumes:
      - ./src:/opt/airflow/src
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./models:/opt/airflow/models
      - ./.dvc:/opt/airflow/.dvc
      - ./.git:/opt/airflow/.git
    # On initialise la base de données et on force la création de l'utilisateur admin/admin AVANT de lancer standalone
    command: >
      bash -c "
      airflow db migrate && 
      airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@example.com || true && 
      airflow standalone
      "
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      # Adresse de l'API vue depuis le conteneur Airflow (nom du service docker-compose)
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
    depends_on:
      - api

  evidently:
    build:
      context: .
      dockerfile: Dockerfile.evidently
    container_name: trustpilot_evidently
    ports:
      - "8001:8000"
    volumes:
      - ./evidently_workspace:/workspace

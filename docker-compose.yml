version: '3.8'

services:
  # FastAPI
  api:
    image: ghcr.io/k4ndoo/nov24-alt-mlops-trustpilot-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trustpilot_api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
      - ./models:/app/models
      - ./data:/app/data
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}

  # Airflow
  airflow:
    image: ghcr.io/k4ndoo/nov24-alt-mlops-trustpilot-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: trustpilot_airflow
    ports:
      - "8080:8080"
    volumes:
      - ./src:/opt/airflow/src
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./models:/opt/airflow/models
      - ./.dvc:/opt/airflow/.dvc
      - ./.git:/opt/airflow/.git
      - ./evidently_workspace:/opt/airflow/evidently_workspace
      - ./reports:/opt/airflow/reports
    # On initialise la base de données et on force la création de l'utilisateur admin/admin AVANT de lancer standalone
    command: >
      bash -c "
      airflow db migrate && 
      airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@example.com || true && 
      airflow standalone
      "
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}
      # Adresse de l'API vue depuis le conteneur Airflow (nom du service docker-compose)
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
    depends_on:
      - api

  evidently:
    build:
      context: .
      dockerfile: Dockerfile.evidently
    container_name: trustpilot_evidently
    ports:
      - "8001:8000"
    volumes:
      - ./evidently_workspace:/workspace

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: trustpilot_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data:ro
      - ./.env:/app/.env
    environment:
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
    depends_on:
      - api

# ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: trustpilotprometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana:latest

    container_name: trustpilotgrafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      # datasource Prometheus + dashboards chargés au démarrage
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:


